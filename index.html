<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeeti | Pure Execution</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --text-light: #FFFFFF;
            --text-muted: #888888;
            --zeeti-yellow: #FF9900; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 5%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-light);
            text-decoration: none;
        }

        .logo span { color: var(--zeeti-yellow); }

        nav { display: flex; gap: 30px; }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            padding-bottom: 5px;
        }

        /* Premium Nav Hover Effect */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--zeeti-yellow);
            transition: width 0.3s ease;
        }

        nav a:hover::after { width: 100%; }
        nav a:hover { color: var(--zeeti-yellow); }

        .hero {
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 5%;
        }

        .hero h1 {
            font-size: clamp(3.5rem, 8vw, 6.5rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -2px; /* Tightened for architectural feel */
            margin-bottom: 25px;
        }

        .hero h1 .highlight-yellow { 
            color: var(--zeeti-yellow); 
            text-shadow: 0 0 20px rgba(255, 153, 0, 0.15); /* Subtle glow */
        }

        .hero p {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            font-weight: 300;
            max-width: 600px;
            margin-bottom: 40px;
            color: #AAAAAA;
        }
        
        /* Emphasized Tagline */
        .hero p .strong-text {
            color: var(--text-light);
            font-weight: 500;
        }

        .btn {
            padding: 16px 32px;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--zeeti-yellow);
            color: #000000;
            border: 2px solid var(--zeeti-yellow);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--zeeti-yellow);
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-light);
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-left: 15px;
        }

        .btn-secondary:hover { 
            border-color: var(--text-light); 
            background-color: rgba(255, 255, 255, 0.05);
        }

        footer {
            padding: 30px 5%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-links { display: flex; gap: 20px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.5px; }
        .footer-links a:hover { color: var(--text-light); }
        .copyright { color: var(--text-muted); font-size: 0.8rem; letter-spacing: 0.5px; }
        
        #easter-egg-trigger { cursor: crosshair; color: var(--text-light); font-weight: 800; }
        #easter-egg-trigger:hover { color: var(--zeeti-yellow); text-shadow: 0 0 8px var(--zeeti-yellow); }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 20px; padding: 25px 5%; }
            nav { gap: 20px; flex-wrap: wrap; justify-content: center; }
            .hero { align-items: center; text-align: center; padding-top: 50px; padding-bottom: 50px; }
            .hero p { margin-left: auto; margin-right: auto; }
            .btn-secondary { margin-left: 0; margin-top: 15px; }
            .hero-buttons { display: flex; flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto; }
            .hero-buttons .btn { width: 100%; text-align: center; }
            footer { flex-direction: column; text-align: center; padding-bottom: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Zee<span>ti</span></a>
        <nav>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1 id="hero-title">Digital <br><span class="highlight-yellow">Architecture.</span></h1>
        <p>We build high-performance brand identities and digital infrastructure. <span class="strong-text">Zero noise. Just execution.</span></p>
        
        <div class="hero-buttons">
            <a href="start.html" class="btn btn-primary">Start a Project</a>
            <a href="services.html" class="btn btn-secondary">View Services</a>
        </div>
    </section>

    <footer>
        <div class="copyright">
            &copy; 2026 <span id="easter-egg-trigger">Zeeti</span>. All rights reserved.
        </div>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-service.html">Terms of Service</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>

    <script>
        document.getElementById('easter-egg-trigger').addEventListener('click', function() {
            if (document.getElementById('override-terminal')) return;

            const style = document.createElement('style');
            style.id = 'override-styles';
            style.innerHTML = `
                @keyframes glitch-shake {
                    0% { transform: translate(2px, 1px) rotate(0deg); filter: invert(0); }
                    20% { transform: translate(-3px, 0px) rotate(1deg); filter: invert(1); }
                    40% { transform: translate(1px, -2px) rotate(-1deg); filter: invert(0); }
                    60% { transform: translate(-3px, 1px) rotate(0deg); filter: invert(1); }
                    80% { transform: translate(2px, 2px) rotate(1deg); filter: invert(0); }
                    100% { transform: translate(0px, 0px) rotate(0deg); filter: invert(0); }
                }
                body.glitching {
                    animation: glitch-shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
                    overflow: hidden;
                }
                #override-terminal {
                    position: fixed;
                    top: 0; left: 0; width: 100vw; height: 100vh;
                    background-color: #050505;
                    z-index: 99999;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    padding: 5%;
                    font-family: 'Courier New', Courier, monospace;
                    color: var(--zeeti-yellow);
                    font-size: clamp(1rem, 4vw, 2rem);
                    font-weight: bold;
                    text-transform: uppercase;
                    box-shadow: inset 0 0 150px rgba(255, 153, 0, 0.15);
                }
                .term-line { opacity: 0; margin-bottom: 15px; text-shadow: 0 0 8px var(--zeeti-yellow); }
                .line-1 { animation: showLine 0.1s 0.5s forwards; }
                .line-2 { animation: showLine 0.1s 1.2s forwards; }
                .line-3 { animation: showLine 0.1s 1.8s forwards; color: #00FF41; text-shadow: 0 0 8px #00FF41; }
                .line-4 { animation: showLine 0.1s 2.6s forwards; }
                .cursor { display: inline-block; width: 15px; height: clamp(1rem, 4vw, 2rem); background-color: var(--zeeti-yellow); animation: blink 0.8s infinite; vertical-align: bottom; margin-left: 10px; }
                @keyframes showLine { to { opacity: 1; } }
                @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
            `;
            document.head.appendChild(style);

            document.body.classList.add('glitching');

            setTimeout(() => {
                const terminal = document.createElement('div');
                terminal.id = 'override-terminal';
                terminal.innerHTML = `
                    <div class="term-line line-1">> INITIATING TACTICAL OVERRIDE...</div>
                    <div class="term-line line-2">> PURGING GENERIC PROTOCOLS...</div>
                    <div class="term-line line-3">> DIGITAL ARCHITECTURE SECURED.</div>
                    <div class="term-line line-4">> INFRASTRUCTURE DEPLOYED.<span class="cursor"></span></div>
                `;
                document.body.appendChild(terminal);
                document.body.classList.remove('glitching'); 

                setTimeout(() => {
                    document.body.classList.add('glitching'); 
                    setTimeout(() => {
                        document.body.removeChild(terminal);
                        document.head.removeChild(style);
                        document.body.classList.remove('glitching');
                    }, 300);
                }, 4500); 

            }, 400); 
        });
    </script>
</body>
</html>
