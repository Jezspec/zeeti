<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Zeeti</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #000000; --text-light: #FFFFFF; --text-muted: #888888; --zeeti-yellow: #FF9900; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease; }
        body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--text-light); text-decoration: none; }
        .logo span { color: var(--zeeti-yellow); }
        nav { display: flex; gap: 25px; }
        nav a { color: var(--text-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover { color: var(--zeeti-yellow); }
        .hero { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 5%; }
        .contact-wrapper { width: 100%; max-width: 600px; }
        .hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; line-height: 1.1; margin-bottom: 15px; user-select: none; }
        .hero h1 .highlight-yellow { color: var(--zeeti-yellow); }
        .hero p { font-size: clamp(1rem, 2vw, 1.1rem); font-weight: 300; margin-bottom: 40px; color: #CCCCCC; }
        form { display: flex; flex-direction: column; gap: 20px; width: 100%; }
        input, select, textarea { background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-light); padding: 18px; border-radius: 4px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--zeeti-yellow); background-color: rgba(255, 153, 0, 0.05); }
        .btn-primary { background-color: var(--zeeti-yellow); color: #000; padding: 18px 30px; font-weight: 800; text-transform: uppercase; border: 2px solid var(--zeeti-yellow); cursor: pointer; border-radius: 4px; }
        .btn-primary:hover { background-color: transparent; color: var(--zeeti-yellow); }
        footer { padding: 30px 5%; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; }
        .copyright { color: var(--text-muted); font-size: 0.8rem; }
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background-color: #25d366; color: white; border-radius: 50%; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 30px; z-index: 1000; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Zee<span>ti</span></a>
        <nav><a href="services.html">Services</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
    </header>
    <section class="hero">
        <div class="contact-wrapper">
            <h1 id="ghost-trigger">Initiate <span class="highlight-yellow">Contact.</span></h1>
            <p>Transmit your project parameters below. Zero noise. Just execution.</p>
            <form name="contact" method="POST" data-netlify="true" action="/">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <select name="service" required>
                    <option value="" disabled selected>Select a Service...</option>
                    <option value="architectural">Architectural Engineering</option>
                    <option value="consultation">Creative Consultation</option>
                    <option value="other">Other Inquiry</option>
                </select>
                <textarea name="message" rows="5" placeholder="Project details..." required></textarea>
                <button type="submit" class="btn btn-primary">Transmit Request</button>
            </form>
        </div>
    </section>
    <a href="https://wa.me/27834315252" class="whatsapp-float">💬</a>
    <footer><div class="copyright">&copy; 2026 Zeeti. All rights reserved.</div></footer>

    <script>
        const trigger = document.getElementById('ghost-trigger');
        const originalText = trigger.innerHTML;
        trigger.addEventListener('dblclick', function() {
            trigger.style.color = '#FF9900';
            trigger.innerText = "SIGNAL: +27 83 431 5252";
            setTimeout(() => { trigger.innerHTML = originalText; trigger.style.color = ''; }, 1000);
        });
    </script>
</body>
