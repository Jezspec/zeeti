<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Zeeti</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --text-light: #FFFFFF;
            --text-muted: #888888;
            --zeeti-yellow: #FF9900; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 5%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-light);
            text-decoration: none;
        }

        .logo span { color: var(--zeeti-yellow); }

        nav { display: flex; gap: 30px; }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            padding-bottom: 5px;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--zeeti-yellow);
            transition: width 0.3s ease;
        }

        nav a:hover::after, nav a.active::after { width: 100%; }
        nav a:hover, nav a.active { color: var(--zeeti-yellow); }

        .contact-container {
            flex-grow: 1;
            padding: 80px 5%;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .contact-header { margin-bottom: 60px; }
        .contact-header h1 { 
            font-size: clamp(3rem, 6vw, 5rem); 
            font-weight: 800; 
            color: var(--zeeti-yellow); 
            margin-bottom: 15px; 
            line-height: 1.05;
            letter-spacing: -2px;
        }
        .contact-header p { color: #AAAAAA; font-size: clamp(1.1rem, 2vw, 1.25rem); font-weight: 300; }

        .contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px; }
        
        .contact-info h2 { font-size: 1.1rem; color: var(--text-light); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1.5px; }
        .contact-info p { color: #AAAAAA; margin-bottom: 40px; font-size: 1rem; font-weight: 300; }
        .contact-info p strong { color: var(--zeeti-yellow); font-weight: 500; letter-spacing: 1px; }
        .contact-info a { color: var(--text-light); text-decoration: none; transition: color 0.3s ease; }
        .contact-info a:hover { color: var(--zeeti-yellow); }

        form { display: flex; flex-direction: column; gap: 25px; }
        
        input, textarea {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 20px;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        
        input:focus, textarea:focus { 
            border-color: var(--zeeti-yellow); 
            background-color: rgba(255, 153, 0, 0.02); 
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.1);
        }
        
        textarea { resize: vertical; min-height: 180px; }

        #submit-btn {
            background-color: var(--zeeti-yellow); 
            color: #000; 
            border: 2px solid var(--zeeti-yellow);
            padding: 18px 40px; 
            font-size: 0.9rem; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1.5px; 
            cursor: pointer; 
            align-self: flex-start;
        }
        
        #submit-btn:hover { 
            background-color: transparent; 
            color: var(--zeeti-yellow); 
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.3);
        }

        footer {
            padding: 40px 5%; border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; }
        .footer-links a:hover { color: var(--text-light); }
        .copyright { color: var(--text-muted); font-size: 0.8rem; }

        #easter-egg-trigger { cursor: crosshair; color: var(--text-light); font-weight: 800; padding: 5px; }
        #easter-egg-trigger:hover { color: var(--zeeti-yellow); text-shadow: 0 0 8px var(--zeeti-yellow); }

        /* --- WhatsApp Floating Button CSS --- */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            z-index: 9999;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .whatsapp-icon {
            width: 35px;
            height: 35px;
            fill: white;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 20px; padding: 25px 5%; }
            nav { gap: 20px; flex-wrap: wrap; justify-content: center; }
            .contact-container { padding-top: 50px; padding-bottom: 50px; }
            .contact-grid { grid-template-columns: 1fr; gap: 50px; }
            #submit-btn { width: 100%; text-align: center; }
            footer { flex-direction: column; text-align: center; padding-bottom: 40px; }
            
            /* Mobile adjustments for WhatsApp button */
            .whatsapp-float {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
            }
            .whatsapp-icon {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Zee<span>ti</span></a>
        <nav>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

    <section class="contact-container">
        <div class="contact-header">

        <div class="contact-grid">

                <h2>Status</h2>

                <h2>Direct Inquiries</h2>
                <p><a href="mailto:inbound@zeeti.co.za">inbound@zeeti.co.za</a></p>

            <form name="contact" method="POST" data-netlify="true">
                <input type="text" name="name" placeholder="Name or Alias" required>

                <button type="submit" id="submit-btn">Transmit</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="copyright">
            &copy; 2026 <span id="easter-egg-trigger">Zeeti</span>. All rights reserved.
        </div>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-service.html">Terms of Service</a>
            <a href="contact.html">Contact</a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const trigger = document.getElementById('easter-egg-trigger');
            
            // The characters the screen scrambles into (The Matrix set)
            const chars = "日𝘎ﾘﾪアヰｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ23456789%&$#@";

            // Recursive function to find all text nodes in the DOM
            function getTextNodes(node) {
                let textNodes = [];
                if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim() !== "") {
                    textNodes.push(node);
                } else {
                    for (let child of node.childNodes) {
                        textNodes = textNodes.concat(getTextNodes(child));
                    }
                }
                return textNodes;
            }

            // Scramble animation logic (targets specific text node and saves original value)
            const originalText = new Map();

            function scrambleNode(node, steps, final = false) {
                if (!originalText.has(node)) {
                    originalText.set(node, node.nodeValue);
                }

                if (final) {
                    node.nodeValue = originalText.get(node);
                    originalText.delete(node);
                    return;
                }

                let original = originalText.get(node);
                node.nodeValue = original.split("")
                    .map(() => chars[Math.floor(Math.random() * chars.length)])
                    .join("");
            }

            if (trigger) {
                trigger.addEventListener('click', function() {
                    // Prevent multiple instances
                    if (document.body.classList.contains('system-scramble')) return;
                    document.body.classList.add('system-scramble');

                    // Capture all text nodes on the entire page
                    const allNodes = getTextNodes(document.body);

                    // --- Phase 1: Total Scramble ---
                    // Multiple quick scrambles for dynamic cipher look
                    let scrambleInterval = setInterval(() => {
                        allNodes.forEach(node => scrambleNode(node, 1));
                    }, 80);

                    // --- Phase 2: Total Restoration ---
                    // After 2 seconds, stop scrambling and revert everything back exactly Like nothing happened.
                    setTimeout(() => {
                        clearInterval(scrambleInterval);
                        allNodes.forEach(node => scrambleNode(node, 1, true)); // Revert
                        document.body.classList.remove('system-scramble');
                    }, 2000); 
                });
            }
        });
    </script>
</body>
