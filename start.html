<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start | Zeeti</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --text-light: #FFFFFF;
            --text-muted: #888888;
            --zeeti-yellow: #FF9900; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 60px 5%;
        }

        .profile {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-light);
        }

        .logo span { color: var(--zeeti-yellow); }

        .profile p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 450px;
        }

        .link-btn {
            display: block;
            background-color: transparent;
            color: var(--text-light);
            text-decoration: none;
            padding: 22px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
        }

        .link-btn:hover {
            border-color: var(--zeeti-yellow);
            color: var(--zeeti-yellow);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 153, 0, 0.1);
        }

        /* The "Wow" WhatsApp Button */
        .link-btn.primary {
            background-color: var(--zeeti-yellow);
            color: #000;
            border-color: var(--zeeti-yellow);
        }

        .link-btn.primary:hover {
            background-color: transparent;
            color: var(--zeeti-yellow);
        }

        footer {
            margin-top: auto;
            padding-top: 60px;
            text-align: center;
        }

        .copyright {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="profile">
        <a href="index.html" class="logo">Zee<span>ti</span></a>
        <p>Digital Architecture</p>
    </div>

    <div class="links-container">
        <a href="index.html" class="link-btn">Official Website</a>
        <a href="services.html" class="link-btn">View Services</a>
        
        <a href="contact.html" class="link-btn">Inquiry Form</a>
        
        <a href="https://wa.me/27834315252?text=Hi%20Zeeti,%20I'd%20like%20to%20start%20a%20project." class="link-btn primary">WhatsApp Me Direct</a>
    </div>

    <footer>
        <div class="copyright">
            &copy; 2026 ZEETI. All rights reserved.
        </div>
    </footer>

</body>
</html>
