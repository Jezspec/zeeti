<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a Project | Zeeti</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --text-light: #FFFFFF;
            --text-muted: #888888;
            --zeeti-yellow: #FF9900; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-light);
            text-decoration: none;
        }

        .logo span { color: var(--zeeti-yellow); }

        nav { display: flex; gap: 25px; }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover { color: var(--zeeti-yellow); }

        .hero {
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 5%;
        }

        .form-wrapper {
            width: 100%;
            max-width: 700px;
            background-color: rgba(255, 255, 255, 0.02);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 10px;
            text-align: left;
        }

        .hero h1 .highlight-yellow { color: var(--zeeti-yellow); }

        /* The Easter Egg Trigger Word */
        #egg-trigger {
            cursor: crosshair;
            user-select: none;
        }

        .hero p {
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 30px;
            color: var(--text-muted);
            text-align: left;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row input, .form-row select {
            flex: 1;
        }

        input, select, textarea {
            background-color: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-light);
            padding: 18px;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--zeeti-yellow);
            background-color: rgba(255, 153, 0, 0.05);
        }

        select option {
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        .btn-primary {
            background-color: var(--zeeti-yellow);
            color: #000000;
            border: 2px solid var(--zeeti-yellow);
            padding: 20px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--zeeti-yellow);
        }

        footer {
            padding: 30px 5%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .copyright { color: var(--text-muted); font-size: 0.8rem; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; margin-left: 15px; }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; gap: 20px; }
            .form-wrapper { padding: 25px; }
            header { flex-direction: column; gap: 15px; }
        }

        /* Easter Egg Glitch Animation */
        @keyframes hardcore-glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-3px, 3px) }
            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }
            80% { transform: translate(3px, -3px) }
            100% { transform: translate(0) }
        }

        .glitching {
            animation: hardcore-glitch 0.1s linear 5;
            filter: invert(1);
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Zee<span>ti</span></a>
        <nav>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div class="form-wrapper">
            <h1>Project <span class="highlight-yellow" id="egg-trigger">Initiation.</span></h1>
            <p>Provide your project parameters below. We will analyze and execute.</p>

            <form name="project-intake" method="POST" data-netlify="true" action="/">
                
                <div class="form-row">
                    <input type="text" name="name" placeholder="Full Name or Company" required>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>

                <div class="form-row">
                    <select name="service-type" required>
                        <option value="" disabled selected>Primary Objective...</option>
                        <option value="brand-identity">Brand Identity Architecture</option>
                        <option value="digital-platform">Digital Platform / Website</option>
                        <option value="consultation">Creative Engineering Consultation</option>
                    </select>

                    <select name="timeline" required>
                        <option value="" disabled selected>Expected Timeline...</option>
                        <option value="asap">ASAP (Priority Execution)</option>
                        <option value="1-month">Within 1 Month</option>
                        <option value="flexible">Flexible / Exploring Options</option>
                    </select>
                </div>

                <textarea name="project-scope" rows="6" placeholder="Define the scope and objectives of your project..." required></textarea>
                
                <button type="submit" class="btn-primary" id="deploy-btn">Deploy Project Brief</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="copyright">
            &copy; 2026 Zeeti. All rights reserved.
        </div>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy</a>
            <a href="terms-of-service.html">Terms</a>
        </div>
    </footer>

    <script>
        let tapCount = 0;
        let tapTimer;

        document.getElementById('egg-trigger').addEventListener('click', function() {
            tapCount++;
            
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => { tapCount = 0; }, 1000); 

            if (tapCount === 3) {
                document.body.classList.add('glitching');
                const btn = document.getElementById('deploy-btn');
                const originalText = btn.innerText;
                
                setTimeout(() => {
                    document.body.classList.remove('glitching');
                    btn.innerText = "> OVERRIDE ACCEPTED <";
                    btn.style.backgroundColor = "transparent";
                    btn.style.color = "#FF9900";
                    btn.style.border = "2px solid #FF9900";
                }, 500);

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                    btn.style.color = "";
                    tapCount = 0;
                }, 3500);
            }
        });
    </script>

</body>
</html>
